site_name: Kroki Plugin Playground
docs_dir: docs


plugins:
  - search
  - kroki:
      fence_prefix: ''
      http_method: POST
      diagram_background_color_light: "#f8f8f8"
      diagram_background_color_dark: "#999696"
      styles:
        box:
          fill: "#fce4c6"
          stroke: "#D65108"
        actor:
          fill: "#f8d4a8"
          stroke: "#a33d06"
        note:
          fill: "#fff8e1"
          stroke: "#f9a825"
          color: "#5d4037"
        package:
          fill: "#fff3e0"
          stroke: "#e65100"
          color: "#bf360c"
        text:
          fill: "#24292e"
          font-family: "Arial"
          font-size: "13"
        line:
          stroke: "#D65108"
          label-background: "#fce4c6"
        background:
          fill: "#fdf6ef"
  - techdocs-core

nav:
  - Home: index.md
  - Diagrams:
      - Sequence & Activity: diagrams.md
      - Network & Infrastructure: network.md
      - UML & Class Diagrams: uml.md
      - Data Modeling: data-modeling.md
      - Text & ASCII Diagrams: text-diagrams.md
      - Data Visualization & Signals: data-visualization.md
      - Hardware & Electronics: hardware.md
      - Other Formats: other-formats.md
      - Global Styles: styles.md
